version: 2
updates:
  # pnpm workspace (Dependabot reads pnpm-lock.yaml through the npm ecosystem)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    groups:
      # One PR for all minor and patch updates instead of one per package
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, ci]
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ['*']

  # Image tags in infra/compose (patch rebuilds and new versions)
  - package-ecosystem: docker-compose
    directory: /infra/compose
    schedule:
      interval: weekly
    labels: [dependencies, 'area: infra']
    commit-message:
      prefix: chore
      include: scope
    groups:
      images:
        patterns: ['*']
