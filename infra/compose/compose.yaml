# Local development only (production: compose.prod.yaml). Services are grouped by profile:
# core, events and queue start with `pnpm infra:up`; console (Kafka UI) with
# `pnpm infra:console`; tools only when run. Credentials are throwaway local defaults.

name: pulse

services:
  postgres:
    image: postgis/postgis:18-3.6
    # The image is amd64-only; Apple Silicon runs it under Rosetta (ADR 0001)
    platform: linux/amd64
    profiles: [core]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulse}
      POSTGRES_DB: ${POSTGRES_DB:-pulse}
    # Localhost only, so nothing is reachable from shared Wi-Fi
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    # PostgreSQL 18 images keep data in a versioned subfolder; mount the parent
    volumes:
      - pg-data:/var/lib/postgresql
      # Creates the pulse_* roles; runs only when pg-data is empty (`pnpm infra:reset` re-runs it)
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP, not the socket: the temporary server the image starts while setting up the database answers on the socket only
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    mem_limit: 512m

  redis:
    image: redis:8.8-alpine
    profiles: [core]
    # Cache only: losing it on restart is fine, so no snapshots; cap memory and evict LRU keys
    command:
      ['redis-server', '--maxmemory', '64mb', '--maxmemory-policy', 'allkeys-lru', '--save', '']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m

  mailpit:
    image: axllent/mailpit:v1.32
    profiles: [core]
    ports:
      - '127.0.0.1:${SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 64m

  kafka:
    image: apache/kafka-native:4.4.0
    profiles: [events]
    environment:
      # One process is both broker (stores records) and KRaft controller (keeps cluster
      # metadata), so there is no ZooKeeper (ADR 0004)
      KAFKA_NODE_ID: 1
      # Saved in the data volume on first start; pinned so a newer image with a different
      # default still opens an existing volume
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two doors for clients: HOST for programs on the laptop, DOCKER for containers on the
      # Compose network. Each door tells its clients an address they can actually reach.
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://127.0.0.1:${KAFKA_PORT:-9092},DOCKER://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      # A typo in a topic name must fail, not quietly create a new empty topic
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      # One broker can keep only one copy of Kafka's internal topics; the defaults expect three
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      # A test's consumer starts reading at once instead of waiting 3 s for more group members
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /home/appuser/kraft-logs
    ports:
      - '127.0.0.1:${KAFKA_PORT:-9092}:9092'
    # The image has no data folder, and a volume on a new path is owned by root, so Kafka (user
    # appuser) could not write there. The empty home folder already belongs to appuser.
    volumes:
      - kafka-data:/home/appuser
    healthcheck:
      # The native image has no Kafka tools, so this only proves the port is listening;
      # pnpm infra:smoke proves a real round trip
      test: ['CMD-SHELL', 'nc -z localhost 9092']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    mem_limit: 384m

  # Kafka's command-line tools, which the native image leaves out. Starts only when run:
  # pnpm infra:kafka kafka-topics.sh --bootstrap-server kafka:19092 --list
  kafka-cli:
    image: apache/kafka:4.4.0
    profiles: [tools]
    environment:
      # Tools first so they run by name (kafka-topics.sh); the rest is the image's own PATH,
      # which includes Java: recheck it when upgrading the image
      PATH: /opt/kafka/bin:/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    command: ['kafka-topics.sh', '--bootstrap-server', 'kafka:19092', '--list']
    mem_limit: 384m

  rabbitmq:
    # The management image includes the web UI (http://127.0.0.1:15672)
    image: rabbitmq:4.4-management-alpine
    profiles: [queue]
    # RabbitMQ keeps its data under its node name, which comes from the hostname; Compose would
    # give a random one, and a new name on the next start would ignore the old data
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pulse}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-pulse}
    ports:
      - '127.0.0.1:${AMQP_PORT:-5672}:5672'
      - '127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 384m

  # Browse topics, messages and consumer groups: http://127.0.0.1:8080
  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    profiles: [console]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: pulse-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      # Clusters come only from this file, not from edits in the UI
      DYNAMIC_CONFIG_ENABLED: 'false'
      # The JVM takes a quarter of the container's memory by default, too little for the UI
      JAVA_OPTS: -XX:MaxRAMPercentage=60
    ports:
      - '127.0.0.1:${KAFKA_UI_PORT:-8080}:8080'
    # So `pnpm infra:console` returns once the UI answers, not when Java starts
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/actuator/health | grep -q UP']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    mem_limit: 512m

volumes:
  pg-data:
  kafka-data:
  rabbitmq-data:
