# Node packages only; services/* are Python and C++. e2e runs the built apps together
packages:
  - 'apps/*'
  - 'packages/*'
  - 'e2e'

# One version per shared tool; packages depend on it with "catalog:"
catalog:
  typescript: ~6.0.0
  vitest: ^5.1.0
  fast-check: ^4.10.2
  zod: ^4.6.7
  drizzle-orm: ^0.45.4
  pg: ^8.23.1

# Install scripts run arbitrary code, so each one is denied unless a package truly needs it.
# esbuild ships its binary as a platform package; ssh2/cpu-features are optional native speedups
# (Testcontainers talks to the local Docker socket, not SSH); protobufjs only prints a notice.
allowBuilds:
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false

# Patched versions for Dependabot alerts in dev-only tools whose latest release still pins the old
# one (testcontainers → archiver → glob/minimatch, drizzle-kit → @esbuild-kit → esbuild).
# Remove an entry once the upstream package ships the fix.
overrides:
  'glob@>=9.0.0 <14.0.2': ^14.0.4
  'minimatch@>=7.0.0 <11.0.1': ^11.0.5
  'esbuild@<0.25.0': ^0.25.12
