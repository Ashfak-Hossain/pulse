$kind: http-example
request:
  url: "{{baseUrl}}/auth/sessions"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    content-type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "statusCode": 401,
        "error": "Unauthorized",
        "message": "Unauthorized"
      }
order: 1000
