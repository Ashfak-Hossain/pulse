$kind: http-example
request:
  url: "{{baseUrl}}/auth/otp/verify"
  method: POST
  headers:
    Accept: application/json
    Content-Type: application/json
  body:
    type: json
    content: |-
      {"email": "nobody@student.aiub.edu", "code": "000000"}
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    content-type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "statusCode": 400,
        "error": "Bad Request",
        "message": "Invalid or expired code"
      }
order: 1000
