$kind: collection
description: 'Email one-time-code sign-in and sessions. Run Request code, copy the 6-digit code from the API log ("Sign-in code for …"), paste it as otpCode in the Pulse local environment, then run Verify code: it sets the pulse_at (15 min) and pulse_rt (30 days, path /auth) cookies, which Postman sends from then on. List sessions shows your devices, Refresh swaps pulse_rt for a new pair (the web app does it every 15 min), Sign out everywhere ends every device, Sign out ends this one. Request code picks a fresh AIUB address each send, so Verify answers isNew true the first time. Limits per hour: 5 codes and 5 verifies per address, 60 requests and 120 verifies per IP; over a limit the API answers 429 with Retry-After. Every POST carries Origin: {{appOrigin}}; without it the API answers 403.'
order: 6000
