$kind: http-request
description: "Run right after Sign out everywhere: no device is signed in any more, so the session list answers 401."
url: "{{baseUrl}}/auth/sessions"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 401: no live session any more', () => pm.response.to.have.status(401));
    language: text/javascript
examples: .resources/Sessions after sign out.resources/examples
order: 8000
