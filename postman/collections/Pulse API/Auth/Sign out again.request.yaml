$kind: http-request
description: "Run right after Sign out: the session is gone, so the same request now answers 401."
url: "{{baseUrl}}/auth/sign-out"
method: POST
headers:
  Accept: application/json
  Origin: "{{appOrigin}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 401: no live session any more', () => pm.response.to.have.status(401));
    language: text/javascript
examples: .resources/Sign out again.resources/examples
order: 5000
