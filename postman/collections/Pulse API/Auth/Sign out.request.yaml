$kind: http-request
description: "Ends the device these cookies belong to and clears both cookies. Public on purpose: it works after the access token expired, and answers 204 even when nothing is signed in, as here right after Sign out everywhere."
url: "{{baseUrl}}/auth/sign-out"
method: POST
headers:
  Accept: application/json
  Origin: "{{appOrigin}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 204, signed in or not', () =>
        pm.response.to.have.status(204),
      );
      pm.test('clears both cookies', () => {
        const setCookie = pm.response.headers.filter((h) => h.key.toLowerCase() === 'set-cookie').map((h) => h.value);
        pm.expect(setCookie.some((c) => c.startsWith('pulse_at=;'))).to.equal(true);
        pm.expect(setCookie.some((c) => c.startsWith('pulse_rt=;'))).to.equal(true);
      });
    language: text/javascript
examples: .resources/Sign out.resources/examples
order: 9000
