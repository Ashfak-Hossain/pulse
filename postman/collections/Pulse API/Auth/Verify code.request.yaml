$kind: http-request
description: Swaps a right code for the user, creating it on the first sign-in (isNew true). A code works once; every failure is the same 400. Paste the code from the API log as otpCode first.
url: "{{baseUrl}}/auth/otp/verify"
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
  Origin: "{{appOrigin}}"
body:
  type: json
  content: '{"email": "{{otpEmail}}", "code": "{{otpCode}}"}'
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200 (400: run Request code, paste the new code as otpCode)', () =>
        pm.response.to.have.status(200),
      );
      pm.test('has exactly the contract fields', () => {
        const body = pm.response.json();
        pm.expect(Object.keys(body).sort()).to.eql(['isNew', 'user']);
        pm.expect(Object.keys(body.user).sort()).to.eql(['campusId', 'email', 'id', 'role', 'status']);
      });
      pm.test('is a new student for the address that asked', () => {
        const body = pm.response.json();
        pm.expect(body.isNew).to.equal(true);
        pm.expect(body.user.email).to.equal(pm.environment.get('otpEmail'));
        pm.expect(body.user.role).to.equal('student');
        pm.expect(body.user.status).to.equal('pending_profile');
      });
      pm.test('sets both session cookies, hidden from page scripts', () => {
        pm.expect(pm.cookies.has('pulse_at')).to.equal(true);
        const setCookie = pm.response.headers.filter((h) => h.key.toLowerCase() === 'set-cookie').map((h) => h.value);
        pm.expect(setCookie.some((c) => c.startsWith('pulse_at=') && c.includes('HttpOnly') && c.includes('Path=/;'))).to.equal(true);
        pm.expect(setCookie.some((c) => c.startsWith('pulse_rt=') && c.includes('HttpOnly') && c.includes('Path=/auth'))).to.equal(true);
      });
    language: text/javascript
examples: .resources/Verify code.resources/examples
order: 2000
