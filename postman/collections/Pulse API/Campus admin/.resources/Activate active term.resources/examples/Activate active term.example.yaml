$kind: http-example
request:
  url: "{{baseUrl}}/admin/terms/{{termId}}/activate"
  method: POST
  headers:
    Accept: application/json
    Origin: http://localhost:5173
response:
  statusCode: 409
  statusText: Conflict
  headers:
    content-type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "statusCode": 409,
        "error": "Conflict",
        "message": "Only a draft term can be activated"
      }
order: 1000
