$kind: http-example
request:
  url: "{{baseUrl}}/admin/zones/{{zoneId}}"
  method: DELETE
  headers:
    Accept: application/json
    Origin: http://localhost:5173
response:
  statusCode: 409
  statusText: Conflict
  headers:
    content-type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "statusCode": 409,
        "error": "Conflict",
        "message": "The zone still has meeting points"
      }
order: 1000
