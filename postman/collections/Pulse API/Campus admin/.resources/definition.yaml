$kind: collection
description: 'Gates, zones, meeting points and terms of your campus. Reads (GET /gates, /zones, /meeting-points, each also by /:id) work for any signed-in user; /admin/* needs a campus_admin. Sign in with the Auth folder first, then make that user an admin in psql: update app_user set role = ''campus_admin'' where email = ''<otpEmail>''; (the role is read on every request, so the cookie you have keeps working). Run the folder in order: it creates a gate, a zone and a meeting point with fresh names, reads and renames them, hides the point and deletes the zone and gate again, then creates a draft term and activates it (the campus''s previous active term is archived, and a TermActivated outbox row is written). Every admin write also adds one audit_log row. Writes carry Origin: {{appOrigin}}.'
order: 7000
