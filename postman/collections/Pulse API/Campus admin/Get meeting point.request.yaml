$kind: http-request
description: "One active meeting point by id. Any signed-in user; a hidden point or another campus's id answers 404."
url: "{{baseUrl}}/meeting-points/{{meetingPointId}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('is the point just created', () =>
        pm.expect(pm.response.json().id).to.equal(pm.environment.get('meetingPointId')),
      );
    language: text/javascript
examples: .resources/Get meeting point.resources/examples
order: 7200
