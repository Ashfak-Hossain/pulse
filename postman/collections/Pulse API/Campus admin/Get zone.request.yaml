$kind: http-request
description: "One zone of your campus by id, with its area as GeoJSON. Any signed-in user; another campus's id answers 404."
url: "{{baseUrl}}/zones/{{zoneId}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('is the zone just created', () => {
        const zone = pm.response.json();
        pm.expect(zone.id).to.equal(pm.environment.get('zoneId'));
        pm.expect(zone.area.type).to.equal('MultiPolygon');
      });
    language: text/javascript
examples: .resources/Get zone.resources/examples
order: 4600
