$kind: http-request
description: "Every active meeting point of your campus. Any signed-in user."
url: "{{baseUrl}}/meeting-points"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('lists the new point', () =>
        pm.expect(pm.response.json().items.map((p) => p.id)).to.include(pm.environment.get('meetingPointId')),
      );
    language: text/javascript
examples: .resources/List meeting points.resources/examples
order: 7100
