$kind: http-request
description: "Zones of your campus, by name, each area as GeoJSON. Any signed-in user."
url: "{{baseUrl}}/zones"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('lists the new zone', () =>
        pm.expect(pm.response.json().items.map((z) => z.id)).to.include(pm.environment.get('zoneId')),
      );
    language: text/javascript
examples: .resources/List zones.resources/examples
order: 4500
