$kind: http-request
description: "Active meeting points of your campus; zoneId narrows to one zone. Any signed-in user."
url: "{{baseUrl}}/meeting-points?zoneId={{zoneId}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('lists only the new point', () =>
        pm.expect(pm.response.json().items.map((p) => p.id)).to.eql([pm.environment.get('meetingPointId')]),
      );
    language: text/javascript
examples: .resources/Meeting points in zone.resources/examples
order: 7000
