$kind: http-example
name: '400 Bad Request'
request:
  method: GET
  url: '{{baseUrl}}/campuses/aiub/distance?lat=&lng=90.4274'
response:
  statusCode: 400
  statusText: 'Bad Request'
  headers:
    - key: Content-Type
      value: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "statusCode": 400,
        "error": "Bad Request",
        "message": "Validation failed",
        "issues": [
          {
            "path": "lat",
            "code": "too_small",
            "message": "Too small: expected string to have >=1 characters"
          }
        ]
      }
order: 1000
