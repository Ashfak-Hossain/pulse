$kind: http-example
name: '400 Bad Request'
request:
  method: POST
  url: '{{baseUrl}}/campuses/lookup'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {"email": "invalid"}
response:
  statusCode: 400
  statusText: 'Bad Request'
  headers:
    - key: Content-Type
      value: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "statusCode": 400,
        "error": "Bad Request",
        "message": "Validation failed",
        "issues": [
          {
            "path": "email",
            "code": "invalid_format",
            "message": "Invalid email address"
          }
        ]
      }
order: 1000
