$kind: http-example
request:
  method: POST
  url: '{{baseUrl}}/campuses/lookup'
  headers:
    Content-Type: application/json
    Origin: http://localhost:5173
  body:
    type: json
    content: |-
      {"email": "name@unknown.pulse.test"}
response:
  statusCode: 200
  statusText: 'OK'
  headers:
    Content-Type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "campus": null
      }
order: 1000
