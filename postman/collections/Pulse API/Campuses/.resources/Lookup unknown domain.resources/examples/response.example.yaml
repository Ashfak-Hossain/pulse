$kind: http-example
name: '200 OK'
request:
  method: POST
  url: '{{baseUrl}}/campuses/lookup'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {"email": "name@unknown.pulse.test"}
response:
  statusCode: 200
  statusText: 'OK'
  headers:
    - key: Content-Type
      value: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "campus": null
      }
order: 1000
