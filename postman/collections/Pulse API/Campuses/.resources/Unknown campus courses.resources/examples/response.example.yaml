$kind: http-example
name: '404 Not Found'
request:
  method: GET
  url: '{{baseUrl}}/campuses/unknown-campus/courses'
response:
  statusCode: 404
  statusText: 'Not Found'
  headers:
    - key: Content-Type
      value: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "statusCode": 404,
        "error": "Not Found",
        "message": "Campus not found"
      }
order: 1000
