$kind: http-example
request:
  url: "{{baseUrl}}/campuses/nowhere"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 404
  statusText: Not Found
  headers:
    content-type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "statusCode": 404,
        "error": "Not Found",
        "message": "Campus not found"
      }
order: 1000
