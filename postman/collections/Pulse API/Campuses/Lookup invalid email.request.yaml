$kind: http-request
description: 'Find a public campus summary from a synthetic email address in the JSON body.'
url: '{{baseUrl}}/campuses/lookup'
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {"email": "invalid"}
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 400', () => pm.response.to.have.status(400));
      pm.test('reports an email validation issue', () => pm.expect(pm.response.json().issues.map(issue => issue.path)).to.include('email'));
    language: text/javascript
examples: '.resources/Lookup invalid email.resources/examples'
order: 7000
