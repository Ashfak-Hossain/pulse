$kind: http-request
description: 'Find a public campus summary from a synthetic email address in the JSON body.'
url: '{{baseUrl}}/campuses/lookup'
method: POST
headers:
  Accept: application/json
  Content-Type: application/json
body:
  type: json
  content: |-
    {"email": "name@unknown.pulse.test"}
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('returns no campus for an unknown domain', () => pm.expect(pm.response.json()).to.eql({ campus: null }));
    language: text/javascript
examples: '.resources/Lookup unknown domain.resources/examples'
order: 6000
