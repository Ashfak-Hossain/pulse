$kind: http-example
name: '200 OK'
request:
  method: POST
  url: '{{baseUrl}}/fares/split-preview'
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: '{"totalPaisa": 10000, "weights": [1, 1, 1]}'
