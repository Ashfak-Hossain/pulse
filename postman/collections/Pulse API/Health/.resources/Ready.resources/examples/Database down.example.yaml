$kind: http-example
request:
  url: "{{baseUrl}}/health/ready"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 503
  statusText: Service Unavailable
  headers:
    content-type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "status": "error",
        "checks": {
          "database": "down"
        }
      }
order: 2000
