$kind: http-example
request:
  url: "{{baseUrl}}/health/ready"
  method: GET
  headers:
    Accept: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    content-type: application/json; charset=utf-8
  body:
    type: json
    content: |-
      {
        "status": "ok",
        "checks": {
          "database": "up"
        }
      }
order: 1000
