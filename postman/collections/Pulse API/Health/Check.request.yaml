$kind: http-request
description: 'Returns 200 { "status": "ok" } while the process runs.'
url: "{{baseUrl}}/health"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('body is JSON', () => pm.response.to.be.json);
      pm.test('reports ok', () => pm.expect(pm.response.json()).to.eql({ status: 'ok' }));
      pm.test('answers within 2 s', () => pm.expect(pm.response.responseTime).to.be.below(2000));
    language: text/javascript
examples: .resources/Check.resources/examples
order: 1000
