$kind: http-request
description: "One of your own active vehicles by id. Someone else's vehicle, or one you removed, answers 404."
url: "{{baseUrl}}/me/vehicles/{{vehicleId}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('is the vehicle just added', () =>
        pm.expect(pm.response.json().id).to.equal(pm.environment.get('vehicleId')),
      );
    language: text/javascript
examples: .resources/Get vehicle.resources/examples
order: 7500
