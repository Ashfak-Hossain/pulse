$kind: http-request
description: "Your active vehicles. Only ever your own."
url: "{{baseUrl}}/me/vehicles"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: |-
      pm.test('status is 200', () => pm.response.to.have.status(200));
      pm.test('lists the new vehicle', () =>
        pm.expect(pm.response.json().items.map((v) => v.id)).to.include(pm.environment.get('vehicleId')),
      );
    language: text/javascript
examples: .resources/List vehicles.resources/examples
order: 7000
